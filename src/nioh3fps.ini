; nioh3fps.ini - put next to dinput8.dll in the Nioh 3 folder.
; Invalid values fall back to the default and are reported in nioh3fps.log.
[nioh3fps]

; 0 = install nothing (STATUS: DISABLED BY CONFIG). Default 1.
Enabled=1

; Initial state of the runtime toggle (ToggleKey). Default 1 for the S2L offline experiment.
StartEnabled=1

; Debug only: poll nioh3fps.toggle once a second on a dedicated low-priority thread.
; Appearance sets ON, disappearance sets OFF; F10 works until the next edge. Default 0.
ToggleFile=0

; F10 switches the bounded gate and real-dt factors together. Offline testing only.
Lockstep=1
; take (default), xell_entry, xell_exit.
HeartbeatSource=take

; 1 = all hooks and logging active, but r is forced to 1.0 (answers "is it the mod's timing?"). Default 0.
SafeMode=0

; Keys: F1..F24, A..Z, 0..9, Insert/Delete/Home/End/PageUp/PageDown/Pause/ScrollLock, with Ctrl+/Shift+/Alt+.
; Keys only act while the game window is in the foreground. None disables a key.
ToggleKey=F10
DumpKey=Ctrl+F10
; F9 writes a numbered marker into the log and the flight recorder.
MarkerKey=F9

; Raw (default) or Smooth.
TimingMode=Raw
; Smooth only: averaging window, 1..32. Default 8.
AvgFrames=8
; Smooth only: correction gain, (0, 1]. Default 0.2.
SmoothK=0.2
; Factor clamp: ScaleMin in [0.5, 1.0] (default 0.5), ScaleMax in [1.0, 2.0] (default 2.0).
ScaleMin=0.5
ScaleMax=2.0

; Info (default) or Debug (Debug enables call-site histograms and per-tick CSV in debug builds).
; Release builds omit probe CSVs; the S2L trace always records HB and gate events.
LogLevel=Info
