; nioh3fps.ini - keep this next to dinput8.dll in the Nioh 3 folder.
; Invalid values fall back to the default and are reported in nioh3fps.log.
[nioh3fps]

; 0 = load nothing (the game runs unmodified). Default 1.
Enabled=1

; State of the fix when the game starts (1 = on). ToggleKey switches it at runtime. Default 1.
StartEnabled=1

; 1 = smooth variable frame rate (update locked to rendered frames, real-time scaling).
; 0 = hooks stay passive. Default 1.
Lockstep=1
; Render signal used to pace updates: take (default), xell_entry, xell_exit.
HeartbeatSource=take

; 1 = keep hooks and logging but force native timing (troubleshooting). Default 0.
SafeMode=0

; Keys: F1..F24, A..Z, 0..9, Insert/Delete/Home/End/PageUp/PageDown/Pause/ScrollLock, with Ctrl+/Shift+/Alt+.
; Keys only act while the game window is in the foreground. None disables a key.
ToggleKey=F10
; Writes the recent timing trace to a CSV in the game folder (for bug reports).
DumpKey=Ctrl+F10
; Writes a numbered marker into the log and trace (mark the moment you saw a problem).
MarkerKey=F9

; Raw (default) or Smooth.
TimingMode=Raw
; Smooth only: averaging window, 1..32. Default 8.
AvgFrames=8
; Smooth only: correction gain, (0, 1]. Default 0.2.
SmoothK=0.2
; Time-scale clamp: ScaleMin in [0.5, 1.0] (default 0.5), ScaleMax in [1.0, 2.0] (default 2.0).
ScaleMin=0.5
ScaleMax=2.0

; Info (default) or Debug.
LogLevel=Info
