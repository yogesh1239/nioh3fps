; ------------------------------------------------------------------
;  nioh3fps settings
; ------------------------------------------------------------------
;  Keep this file next to dinput8.dll in your Nioh 3 folder.
;  The defaults work for most people, so you shouldn't need to change anything.
;  If a value is invalid, the mod uses the default and notes it in nioh3fps.log.
; ------------------------------------------------------------------

[nioh3fps]

; --- Basics --------------------------------------------------------

; Master switch. 0 = the mod loads nothing and the game runs unmodified.
Enabled=1

; Whether the fix is on when the game starts. You can still toggle it with ToggleKey.
StartEnabled=1

; The smoothing itself: one game update per rendered frame, scaled to real time.
; 0 = the mod stays loaded but does nothing.
Lockstep=1

; Which render signal paces the updates. Leave this on "take" unless asked to change it.
; Options: take, xell_entry, xell_exit
HeartbeatSource=take

; Troubleshooting: 1 = keep the mod loaded and logging, but use the game's normal timing.
SafeMode=0

; --- Keys ----------------------------------------------------------
; Keys only work while the game window is focused.
; Allowed: F1-F24, A-Z, 0-9, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock.
; Add Ctrl+, Shift+ or Alt+ for combinations. Use None to turn a key off.

; Turn the fix on or off.
ToggleKey=F10

; Save the recent timing data to a CSV file in the game folder (for bug reports).
DumpKey=Ctrl+F10

; Write a numbered marker into the log. Press it when you notice a problem.
MarkerKey=F9

; --- Advanced timing -----------------------------------------------
; Only change these if you know you need to.

; Raw (default) uses each frame's real time. Smooth averages over several frames.
TimingMode=Raw

; Smooth mode only: how many frames to average (1-32).
AvgFrames=8

; Smooth mode only: how quickly it corrects towards real time (greater than 0, up to 1).
SmoothK=0.2

; Limits on how much a single update can be stretched or shrunk.
; ScaleMin 0.5-1.0, ScaleMax 1.0-2.0.
ScaleMin=0.5
ScaleMax=2.0

; --- Logging -------------------------------------------------------

; Info (default) or Debug. Debug writes a lot more detail.
LogLevel=Info
